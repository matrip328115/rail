  duplicateTable(){

    const reg =
      Store.getReg(
        this.activeRegId
      );

    const source =
      Store.getTable(
        this.activeRegId,
        this.activeTableId
      );

    if (!reg || !source) return;

    const newTable =
      Store.createTable(
        reg.id,
        source.name + " Copy",
        clone(source.columns)
      );

    if (!newTable) return;

    source.entries.forEach(
      entry => {

        Store.addEntry(
          reg.id,
          newTable.id,
          entry.date,
          clone(entry.values)
        );
      }
    );

    this.activeTableId =
      newTable.id;

    this.renderTable();

    toast(
      "Table duplicated"
    );
  },

  openGlobalMenu(){

    this.sheetMode =
      "global";

    this.openSheet(
      "LASER DATA"
    );

    document.getElementById(
      "sheetBody"
    ).innerHTML = `

      <div class="toolbar">

        <button
          class="tool-btn"
          data-action="exportBackup">
          Export Backup
        </button>

        <button
          class="tool-btn"
          data-action="importBackup">
          Restore Backup
        </button>

      </div>

      <div class="export-note">

        Backup contains local registers,
        tables, entries and recent-value history.

        No server is used.

      </div>
    `;

    document.getElementById(
      "sheetFooter"
    ).innerHTML = `

      <button
        class="secondary-btn"
        data-action="closeSheet">
        Close
      </button>
    `;
  },

  importBackup(){

    const input =
      document.createElement(
        "input"
      );

    input.type = "file";
    input.accept =
      ".json,application/json";

    input.onchange =
      async () => {

        const file =
          input.files?.[0];

        if (!file) return;

        this.confirm(
          "Restore backup?",
          "Current local data will be replaced by the selected backup.",
          async () => {

            try{

              await Store.importBackup(
                file
              );

              this.activeRegId = null;
              this.activeTableId = null;

              this.closeSheet();

              this.go(
                "registers"
              );

              toast(
                "Backup restored"
              );

            }catch(error){

              console.error(
                error
              );

              toast(
                "Invalid backup"
              );
            }
          }
        );
      };

    input.click();
  },

  /* =======================================================
     RENAME TABLE
     ======================================================= */

  saveRenameTable(){

    const input =
      document.getElementById(
        "renameTableInput"
      );

    const name =
      input.value.trim();

    if (!name){

      toast(
        "Table name required"
      );

      return;
    }

    const table =
      Store.getTable(
        this.activeRegId,
        this.activeTableId
      );

    if (!table) return;

    table.name = name;

    Store.save();

    this.closeSheet();

    this.renderTable();

    toast(
      "Table renamed"
    );
  },

  exportPDF(){

    const reg =
      Store.getReg(
        this.activeRegId
      );

    const table =
      Store.getTable(
        this.activeRegId,
        this.activeTableId
      );

    if (!reg || !table) return;

    const rows =
      this.getFilteredRows();

    const generated =
      new Date();

    const generatedDate =
      [
        generated.getFullYear(),
        pad2(
          generated.getMonth()+1
        ),
        pad2(
          generated.getDate()
        )
      ].join("-");

    const html = `

      <div id="pdfPrintRoot">

        <div class="pdf-title">
          ${esc(reg.name)}
          — ${esc(table.name)}
        </div>

        <div class="pdf-meta">

          Year ${reg.year}
          · ${MONTHS_F[
              this.view.month
            ]}

          ${
            this.view.day !== null
              ? " · Day " +
                this.view.day
              : ""
          }

          · ${rows.length} rows

          · Generated ${generatedDate}

        </div>

        <table>

          <thead>

            <tr>

              <th>
                #
              </th>

              <th>
                Date
              </th>

              ${table.columns.map(
                col => `

                  <th>
                    ${esc(col.name)}
                  </th>

                `
              ).join("")}

            </tr>

          </thead>

          <tbody>

            ${
              rows.length
                ? rows.map(
                    (entry,index) => `

                      <tr>

                        <td>
                          ${index + 1}
                        </td>

                        <td>
                          ${formatDateShort(
                            entry.date
                          )}
                        </td>

                        ${table.columns.map(
                          col => {

                            const value =
                              entry.values[
                                col.id
                              ] ?? "";

                            const display =
                              col.type ===
                              "number"
                                ? num(value)
                                : String(
                                    value
                                  );

                            return `

                              <td
                                class="${
                                  col.type ===
                                  "number"
                                    ? "pdf-number"
                                    : ""
                                }">

                                ${esc(
                                  display
                                )}

                              </td>

                            `;
                          }
                        ).join("")}

                      </tr>

                    `
                  ).join("")
                : `

                  <tr>

                    <td
                      colspan="${
                        table.columns.length + 2
                      }">

                      No matching entries

                    </td>

                  </tr>

                `
            }

          </tbody>

        </table>

      </div>
    `;

    const old =
      document.getElementById(
        "pdfPrintRoot"
      );

    if (old){
      old.remove();
    }

    document.body.insertAdjacentHTML(
      "beforeend",
      html
    );

    setTimeout(
      () => {

        window.print();

        setTimeout(
          () => {

            const root =
              document.getElementById(
                "pdfPrintRoot"
              );

            if (root){
              root.remove();
            }

          },
          1200
        );

      },
      200
    );
  }
};

/* =========================================================
   NEW TABLE EXTRA ACTIONS
   ========================================================= */

document.addEventListener(
  "click",
  event => {

    const action =
      event.target.closest(
        "[data-action]"
      )?.dataset.action;

    if (!action) return;

    if (
      action ===
      "addNewTableColumn"
    ){

      if (
        App.sheetMode !==
        "table"
      ){
        return;
      }

      App.draftEntry.columns.push({

        id:"c_" + uid(),

        name:"Field " +
          (
            App.draftEntry.columns.length +
            1
          ),

        type:"text"
      });

      App.renderNewTableColumns();
    }

    if (
      action ===
      "removeNewTableColumn"
    ){

      App.draftEntry.columns =
        App.draftEntry.columns.filter(
          c =>
            c.id !==
            event.target.closest(
              "[data-action]"
            ).dataset.id
        );

      App.renderNewTableColumns();
    }

    if (
      action ===
      "saveRenameTable"
    ){

      App.saveRenameTable();
    }
  }
);

/* =========================================================
   SHEET BACKDROP CLICK
   ========================================================= */

document
  .getElementById(
    "sheetBackdrop"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "sheetBackdrop"
      ){

        App.closeSheet();
      }
    }
  );

/* =========================================================
   MODAL BACKDROP CLICK
   ========================================================= */

document
  .getElementById(
    "modalBackdrop"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "modalBackdrop"
      ){

        App.closeModal();
      }
    }
  );

/* =========================================================
   BOOT
   ========================================================= */

App.init();

</script>
